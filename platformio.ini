; PlatformIO Project Configuration File

[platformio]
default_envs = birdy

; Target: air-quality-pcb v9 (rev I) — ESP32-C3-WROOM-02-N4 (4 MB flash),
; native USB Serial/JTAG for flashing and the console (no UART bridge).
[common]
platform  = espressif32@^6.9.0
board     = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I src
lib_deps =
    adafruit/Adafruit Unified Sensor@^1.1.15
    madhephaestus/ESP32Servo@^3.0.6
    boschsensortec/bsec2@1.10.2610
    boschsensortec/BME68x Sensor library@^1.3.40408
    bblanchon/ArduinoJson@^7.4.1

; --- Default build: v9 firmware, WiFi mode selected by SW4 at runtime ---
; One image contains everything (setup portal, sparse/continuous upload);
; the slide switch picks the mode — no reflashing. Credentials are never
; compiled in; they are provisioned via the Birdy-Setup captive portal.
[env:birdy]
extends = common

; --- Debug build: verbose serial output ---
[env:birdy_debug]
extends = common
build_flags =
    ${common.build_flags}
    -D DEBUG
    -D CORE_DEBUG_LEVEL=3
